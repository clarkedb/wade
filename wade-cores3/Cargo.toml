[package]
name         = "wade-cores3"
description  = "Wade firmware for the M5Stack CoreS3 Lite"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.97"
license      = "MIT"
publish      = false

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32s3", "log-04", "unstable"] }

esp-rtos = { version = "0.4.0", features = ["embassy", "esp32s3", "log-04"] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "log-04"] }
log                    = "0.4.27"

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-backtrace = { version = "0.20.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.18.0", features = ["esp32s3", "log-04"] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
wade-core        = { path = "../wade-core" }
wade-firmware    = { path = "../wade-firmware" }
embassy-futures  = "0.1.2"
embassy-sync     = "0.8.0"
embassy-embedded-hal = "0.6.0"
embedded-hal-async = "1.0.0"
esp-storage      = { version = "0.10.0", features = ["esp32s3", "embedded-storage"] }


[features]
# Log frame times, touch latency, and uptime for the done criteria (docs/roadmap.md#m3-cores3-port).
measure = []

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'

[lints.rust]
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
