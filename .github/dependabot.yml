version: 2
updates:
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    groups:
      cargo:
        patterns: ["*"]

  # The firmware crates are outside the root workspace, and their updates ship.
  - package-ecosystem: cargo
    directory: /wade-cores3
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
      include: scope
    groups:
      cores3:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /wade-cyd
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
      include: scope
    groups:
      cyd:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
