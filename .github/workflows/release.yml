name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Propose release
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Check release pull request
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          release_branch=$(jq -er '.headBranchName | strings | select(length > 0)' <<< "$RELEASE_PR")
          gh workflow run ci.yml --ref "$release_branch"

  build:
    name: Verify and package
    needs: version
    if: needs.version.outputs.created == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      release-tag: ${{ needs.version.outputs.tag }}
    permissions:
      contents: read

  publish:
    name: Publish verified release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: firmware-*
          merge-multiple: true
          path: packages
      - name: Attach packages and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          cd packages
          sha256sum ./*.zip > SHA256SUMS
          gh release upload "$RELEASE_TAG" ./*.zip SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false

  installer:
    name: Update browser installer
    needs: publish
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
