name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Propose release
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # Release Please pushes with the app's token, not GITHUB_TOKEN, so its
      # pushes trigger CI on the release PR like any other branch.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}

  build:
    name: Verify and package
    needs: version
    if: needs.version.outputs.created == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      release-tag: ${{ needs.version.outputs.tag }}
    permissions:
      contents: read

  publish:
    name: Publish verified release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: firmware-*
          merge-multiple: true
          path: packages
      - name: Attach packages and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          cd packages
          sha256sum ./*.zip > SHA256SUMS
          gh release upload "$RELEASE_TAG" ./*.zip SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false

  installer:
    name: Update browser installer
    needs: publish
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
