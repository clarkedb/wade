name: CI

on:
  push:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on branches, but let every commit on main finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  workspace:
    name: Workspace
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release-tag || github.sha }}

      # wade-desktop's window needs SDL2 and its audio needs ALSA.
      - name: Install SDL2 and ALSA
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libasound2-dev

      # Installs the channel, components, and targets from rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The checks from docs/testing.md#checks.
      - name: Product version
        run: scripts/check-version.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Installer downloads
        run: |
          npm ci --prefix site
          npm test --prefix site
          npm --prefix site run build

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # Clippy above only sees wade-core with std (feature unification); lint the
      # no_std builds too. This also proves both crates build without std.
      - name: wade-core and wade-firmware build and lint without std
        run: cargo clippy -p wade-core -p wade-firmware --lib --target thumbv7em-none-eabihf --locked -- -D warnings

      - name: wade-core and wade-firmware do not use alloc
        run: test -d wade-core/src && test -d wade-firmware/src && ! grep -rnE 'extern[[:space:]]+crate[[:space:]]+alloc' wade-core/src wade-firmware/src

  firmware:
    name: Firmware (${{ matrix.board }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: CYD
            crate: wade-cyd
            chip: esp32
          - board: CoreS3
            crate: wade-cores3
            chip: esp32s3
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release-tag || github.sha }}

      # Espressif's Rust fork for Xtensa, the `esp` channel in each firmware crate's rust-toolchain.toml.
      # Pinned to the version espup installs locally; bump both together.
      - uses: esp-rs/xtensa-toolchain@ec6d36527049a7f4fb2cb0c1a644668c1bb8a2a4 # v1.7.0
        with:
          buildtargets: ${{ matrix.chip }}
          version: 1.97.0.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ matrix.crate }}

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --release --locked -- -D warnings

      - name: Clippy with measurements
        run: cargo clippy --release --locked --features measure -- -D warnings

      - name: Build
        run: cargo build --release --locked

      - name: Install packaging tool
        if: inputs.release-tag != ''
        working-directory: .
        run: |
          rustup toolchain install
          cargo install espflash --version 4.6.0 --locked

      - name: Package firmware
        if: inputs.release-tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          BOARD: ${{ matrix.chip == 'esp32' && 'cyd' || 'cores3' }}
        run: |
          test "$RELEASE_TAG" = "v$(cat ../version.txt)"
          ../scripts/package-firmware.sh "$BOARD"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.release-tag != ''
        with:
          name: firmware-${{ matrix.chip }}
          path: dist/*.zip
          if-no-files-found: error
