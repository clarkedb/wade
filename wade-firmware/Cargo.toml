[package]
name = "wade-firmware"
description = "Device logic shared by Wade's firmware crates, testable on the host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Keep this no_std and allocation-free, like wade-core: firmware links it.
wade-core.workspace = true
embedded-graphics.workspace = true
embedded-storage-async.workspace = true
sequential-storage.workspace = true

[dev-dependencies]
embassy-futures.workspace = true
# The in-memory mock flash; dev-only, so the library stays no_std.
sequential-storage = { workspace = true, features = ["_test"] }

[lints]
workspace = true
