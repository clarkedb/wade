[workspace]
resolver = "3"
members = ["wade-core", "wade-desktop"]
# wade-cores3 needs the Xtensa toolchain; spikes/ are throwaway. See docs/architecture.md#crates.
exclude = ["wade-cores3", "spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/clarkedb/wade"
publish = false

[workspace.dependencies]
wade-core = { path = "wade-core" }

embedded-graphics = "0.8.2"
heapless = "0.9.3"
libm = "0.2.16"

clap = { version = "4.6.7", features = ["derive"] }
embedded-graphics-simulator = "0.8.0"
getrandom = "0.4.3"
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }

png = "0.18.1"
proptest = "1.11.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
